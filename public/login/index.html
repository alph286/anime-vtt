<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIN del DM</title>
<link rel="stylesheet" href="/shared/theme.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
  }
  main { width: 100%; max-width: 320px; padding: 24px; text-align: center; }
  h1 { margin: 0 0 16px; font-size: 22px; font-weight: 700; }
  form { display: flex; flex-direction: column; gap: 12px; }
  input {
    padding: 10px 12px;
    font-size: 18px;
    text-align: center;
    letter-spacing: 0.3em;
    color: var(--text-primary);
    background: var(--bg-control);
    border: 1px solid var(--border-control);
    border-radius: 6px;
  }
  button {
    padding: 10px 12px;
    font-size: 16px;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  #login-error { margin: 12px 0 0; color: var(--danger-text); }
</style>
</head>
<body>
<main>
  <h1>PIN del DM</h1>
  <form id="login-form">
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" autofocus>
    <button type="submit">Entra</button>
  </form>
  <p id="login-error" hidden></p>
</main>
<script src="/login/login.js"></script>
</body>
</html>
